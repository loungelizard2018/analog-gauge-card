# ============================================================================
# Analog Gauge Card — finale, vollständig kommentierte Referenzkonfiguration
# ============================================================================
#
# Diese Konfiguration entspricht der im README gezeigten Home-Assistant-Karte.
# Nur die Entity muss für ein anderes Gerät angepasst werden.
#
# Voraussetzungen:
#   1. Installation über HACS als Dashboard-Karte
#   2. Ressource wird von HACS automatisch geladen
#   3. Stabiler Kartentyp: custom:analog-gauge-card
#
# Intern zeichnet die Karte auf einer virtuellen Fläche von 1024 × 1024 Pixeln.
# Alle X-/Y-Werte und Radien unten beziehen sich auf dieses Koordinatensystem.

# ----------------------------------------------------------------------------
# 1) KARTE UND DATENQUELLE
# ----------------------------------------------------------------------------
type: custom:analog-gauge-card

# Numerische Home-Assistant-Entity. Der Zustand muss als Zahl lesbar sein.
entity: sensor.bigpool_cpu_temperature

# ----------------------------------------------------------------------------
# 2) MESSBEREICH, EINHEIT UND BESCHRIFTUNG
# ----------------------------------------------------------------------------
# Technischer Messbereich. Werte außerhalb dieses Bereichs werden am jeweiligen
# Skalenende dargestellt.
min: 0
max: 100

# Die Einheit kann ausdrücklich gesetzt werden. Ohne Angabe nutzt die Karte
# nach Möglichkeit unit_of_measurement der Entity.
unit: "°C"

# Linke und rechte Beschriftung oberhalb des schwarzen Mechanikgehäuses.
title: "CPU TEMPERATURE"
subtitle: "CLASS 2.5"

# Anzahl der Nachkommastellen des großen Messwerts.
decimals: 0

# ----------------------------------------------------------------------------
# 3) SKALENTEILUNG
# ----------------------------------------------------------------------------
# Anzahl der beschrifteten Hauptmarken einschließlich min und max.
# Bei 0…100 und 6 Marken entstehen: 0, 20, 40, 60, 80, 100.
major_ticks: 6

# Kleine Teilstriche zwischen zwei Hauptmarken.
minor_ticks: 4

# ----------------------------------------------------------------------------
# 4) MECHANISCHER DREHPUNKT DES ZEIGERS
# ----------------------------------------------------------------------------
# Drehachse des roten Zeigers. Dieser Punkt ist absichtlich unabhängig vom
# Mittelpunkt des Skalenbogens.
pivot_x: 512
pivot_y: 700

# ----------------------------------------------------------------------------
# 5) GEOMETRIE DES SKALENBOGENS
# ----------------------------------------------------------------------------
# Mittelpunkt der Skalenkrümmung. Er liegt in der Mitte des weißen Zifferblatts
# und nicht am tiefer liegenden Zeiger-Pivot.
scale_center_x: 512
scale_center_y: 500

# Gewünschter Radius des farbigen Skalenbogens.
scale_radius: 350

# Winkelbereich der Skala: links -100°, rechts +100°.
scale_start_angle: -100
scale_end_angle: 100

# ----------------------------------------------------------------------------
# 6) AUTOMATISCHE BEGRENZUNG AUF DAS WEISSE ZIFFERBLATT
# ----------------------------------------------------------------------------
# auto verkleinert den effektiven Skalenradius nur dann, wenn Teilstriche oder
# Zahlen sonst aus dem weißen Bereich herausragen würden.
scale_fit: auto

# Mittelpunkt und Radius des tatsächlich sichtbaren weißen Zifferblatts.
dial_center_x: 512
dial_center_y: 500
dial_radius: 400

# Sicherheitsabstand zum schwarzen Instrumentenring. Der Wert 30 verhindert,
# dass insbesondere 0 und 100 in den Rand hineinragen.
dial_margin: 30

# ----------------------------------------------------------------------------
# 7) FARBBOGEN, TEILSTRICHE UND SKALENZAHLEN
# ----------------------------------------------------------------------------
# Breite des farbigen Betriebsbereichs.
zone_width: 24

# Länge der Haupt- und Nebenteilstriche.
major_tick_length: 54
minor_tick_length: 32

# Position der äußeren Teilstrichenden relativ zum farbigen Bogen.
tick_outset: 10

# Grundabstand der Zahlen vom Skalenbogen.
label_offset: 38

# Feinkorrektur aller Zahlen entlang des Radius:
#   positiver Wert  = weiter nach außen
#   negativer Wert  = weiter nach innen
label_radial_adjust: 4

# Zusätzlicher Einzug nur für die erste und letzte Zahl, hier 0 und 100.
label_end_inset: 28

# Platzreserve für die automatische Prüfung der vollständigen Textfläche.
label_safety: 30

# ----------------------------------------------------------------------------
# 8) ZEIGERLÄNGE UND SKALENKONTAKT
# ----------------------------------------------------------------------------
# touch: Die Karte berechnet für jeden Wert den Punkt auf dem gekrümmten
#        Skalenbogen und passt die sichtbare Zeigerlänge geringfügig an.
# fixed: Der Zeiger behält immer exakt needle_length.
needle_length_mode: touch

# Feste Länge für needle_length_mode: fixed; bleibt auch als Referenzwert für
# die Geometrie erhalten.
needle_length: 560

# Feinkorrektur der Zeigerspitze. -5 lässt sie knapp innerhalb des Bogens enden.
needle_reach: -5

# ----------------------------------------------------------------------------
# 9) GROSSER MESSWERT
# ----------------------------------------------------------------------------
# auto legt die Zahl auf die Seite, auf der sie nicht vom Zeiger verdeckt wird.
# Alternativ sind left oder right möglich.
value_position: auto

# Zwei mögliche X-Positionen und eine gemeinsame Y-Position.
value_left_x: 385
value_right_x: 580
value_y: 450

# ----------------------------------------------------------------------------
# 10) EINHEIT RELATIV ZUM MESSWERT
# ----------------------------------------------------------------------------
# relative lässt die Einheit gemeinsam mit dem Wert die Seite wechseln.
# absolute würde eine feste Position über unit_x und unit_y verwenden.
unit_position: relative

# unit_x und unit_y bleiben als dokumentierte absolute Position erhalten.
# Bei unit_position: relative werden stattdessen die Offsets unten verwendet.
unit_x: auto
unit_y: 430

# Relative Verschiebung zur Zahl. Durch die automatische Seitenspiegelung
# bleibt °C jeweils außen neben dem Messwert und nicht unter dem Zeiger.
unit_offset_x: -80
unit_offset_y: -30

# ----------------------------------------------------------------------------
# 11) TITEL UND UNTERTITEL
# ----------------------------------------------------------------------------
# Diese Positionen halten beide Texte vollständig im weißen Bereich und klar
# oberhalb des schwarzen Mechanikgehäuses.
title_x: 255
subtitle_x: 770
text_y: 590

# ----------------------------------------------------------------------------
# 12) ZAHNRÄDER UND RESPONSIVE KARTENGRÖSSE
# ----------------------------------------------------------------------------
# Gemeinsame vertikale Position der drei animierten Zahnräder.
gear_y: 810

# Umdrehungen des mittleren Zahnrads über den vollständigen Messbereich.
# Die beiden Nachbarräder folgen automatisch in Gegenrichtung und mit ihrer
# jeweiligen mechanischen Übersetzung.
gear_turns: 2

# Maximale Breite in CSS-Pixeln. In schmaleren Spalten skaliert die gesamte
# Karte proportional und bleibt quadratisch.
max_width: 720

# ----------------------------------------------------------------------------
# 13) FARBZONEN
# ----------------------------------------------------------------------------
# Die Bereiche können beliebig angepasst oder erweitert werden. Für eine klare
# Skala sollten sie lückenlos innerhalb von min und max liegen.
zones:
  - from: 0
    to: 40
    color: "#4caf50"  # Grün: normal

  - from: 40
    to: 70
    color: "#f6c343"  # Gelb: erhöht

  - from: 70
    to: 100
    color: "#df4332"  # Rot: kritisch

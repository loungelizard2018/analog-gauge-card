name: Publish v4.1.3

on:
  push:
    branches:
      - main
    paths:
      - ".release-publish-v413"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: node --check dist/analog-gauge-card.js

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.1.3 >/dev/null 2>&1; then
            echo "Release v4.1.3 already exists."
          else
            gh release create v4.1.3 \
              --target main \
              --title "Analog Gauge Card v4.1.3" \
              --notes-file release-notes/v4.1.3.md
          fi

      - name: Remove one-time release workflow
        run: |
          rm -f .release-publish-v413
          rm -f .github/workflows/publish-v413.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove v4.1.3 release workflow"
          git push

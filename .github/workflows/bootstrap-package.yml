name: Assemble HACS package

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble JavaScript and visual assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets docs/images
          cat .bootstrap/js/* > dist/analog-gauge-card.js
          cat .bootstrap/assets/base.webp/* | base64 --decode > dist/assets/base.webp
          cat .bootstrap/assets/glass.webp/* | base64 --decode > dist/assets/glass.webp
          cat .bootstrap/assets/needle.webp/* | base64 --decode > dist/assets/needle.webp
          cat .bootstrap/assets/pivot.webp/* | base64 --decode > dist/assets/pivot.webp
          cat .bootstrap/assets/gear-left.webp/* | base64 --decode > dist/assets/gear-left.webp
          cat .bootstrap/assets/gear-center.webp/* | base64 --decode > dist/assets/gear-center.webp
          cat .bootstrap/assets/gear-right.webp/* | base64 --decode > dist/assets/gear-right.webp
          cat .bootstrap/assets/preview.jpg/* | base64 --decode > docs/images/preview.jpg
          node --check dist/analog-gauge-card.js
          test -s dist/assets/base.webp
          test -s docs/images/preview.jpg

      - name: Commit assembled package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish HACS package assets"
          git push

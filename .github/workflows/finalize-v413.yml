name: Finalize v4.1.3

on:
  push:
    branches:
      - main
    paths:
      - ".release-v413"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update runtime version and card documentation link
        shell: python
        run: |
          from pathlib import Path

          path = Path("dist/analog-gauge-card.js")
          source = path.read_text()
          source = source.replace(
              'const ANALOG_GAUGE_V4_VERSION = "4.1.2";',
              'const ANALOG_GAUGE_V4_VERSION = "4.1.3";',
          )
          source = source.replace(
              '    preview: true\n',
              '    preview: true,\n    documentationURL: "https://github.com/loungelizard2018/analog-gauge-card"\n',
          )
          source = source.replace(
              '  "%c ANALOG-GAUGE-CARD %c 4.1.2 ",',
              '  "%c ANALOG-GAUGE-CARD %c 4.1.3 ",',
          )
          path.write_text(source)

      - name: Validate JavaScript
        run: node --check dist/analog-gauge-card.js

      - name: Commit final release state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .release-v413
          rm -f .github/workflows/finalize-v413.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Analog Gauge Card v4.1.3"
          git push

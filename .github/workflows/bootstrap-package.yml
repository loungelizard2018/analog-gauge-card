name: Assemble HACS package

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble standalone JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat .bootstrap/embedded/* > dist/analog-gauge-card.js
          node --check dist/analog-gauge-card.js
          test -s dist/analog-gauge-card.js

      - name: Commit assembled HACS package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish HACS package"
          git push
